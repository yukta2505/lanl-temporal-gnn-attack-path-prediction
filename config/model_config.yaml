# THGNN Model Configuration
# Production-ready hyperparameters optimized for cybersecurity threat detection
# Data path points to E:\XMEGA\DATA as specified

# Model Architecture
model:
  # Core dimensions
  hidden_dim: 256                    # Node embedding dimension
  num_conv_layers: 3                 # Heterogeneous convolution layers
  temporal_hidden: 128               # LSTM hidden dimension
  temporal_layers: 2                 # Number of LSTM layers
  
  # Convolution settings
  conv_type: 'sage'                   # Options: 'gcn', 'gat', 'sage' (sage works best for hetero)
  num_attention_heads: 4             # For GAT and attention mechanisms
  
  # Regularization
  dropout: 0.4                       # Dropout probability
  use_layer_norm: true               # Layer normalization
  use_residual: true                 # Residual connections
  
  # Link prediction
  link_hidden_dims: [256, 128]       # MLP dimensions for link predictor
  use_edge_features: true            # Include edge features
  edge_feature_dim: 3                # Edge feature dimension
  
  # Temporal settings
  sequence_length: 10                # Graph sequence length
  use_bidirectional: true            # Bidirectional LSTM
  
  # Advanced features
  use_uncertainty: true              # Uncertainty quantification
  gradient_checkpointing: false      # Memory optimization (disable for speed)
  temperature: 1.0                   # Temperature scaling

# Training Configuration
training:
  # Optimization
  learning_rate: 0.001               # Adam learning rate
  weight_decay: 1e-5                 # L2 regularization
  batch_size: 8                      # Graph snapshots per batch
  num_epochs: 50                     # Maximum training epochs
  
  # Scheduling
  scheduler: 'cosine'                # Options: 'cosine', 'step', 'plateau'
  warmup_epochs: 5                   # Learning rate warmup
  min_lr: 1e-6                       # Minimum learning rate
  
  # Early stopping
  early_stopping_patience: 10        # Epochs without improvement
  early_stopping_delta: 0.001       # Minimum improvement threshold
  
  # Gradient clipping
  gradient_clip: 1.0                 # Gradient norm clipping
  
  # Negative sampling
  negative_sampling_ratio: 1.0       # Ratio of negative to positive edges
  negative_sampling_strategy: 'mixed' # Options: 'random', 'hard', 'mixed'
  
  # Loss function
  pos_weight: 1.0                    # Weight for positive examples
  neg_weight: 1.0                    # Weight for negative examples
  use_focal_loss: true               # Use focal loss for imbalance
  focal_alpha: 0.25                  # Focal loss alpha
  focal_gamma: 2.0                   # Focal loss gamma
  uncertainty_weight: 0.1            # Uncertainty regularization weight

# Data Configuration
data:
  # Paths (CRITICAL: Points to E:\XMEGA\DATA as specified)
  data_dir: 'E:\XMEGA\DATA'          # Main data directory
  graphs_dir: 'E:\XMEGA\DATA\graphs' # Graph snapshots directory
  metadata_dir: 'E:\XMEGA\DATA\metadata' # Metadata directory
  
  # Graph settings
  time_window_minutes: 5             # Time window for graph snapshots
  max_nodes_per_type: 10000          # Maximum nodes per entity type
  max_edges_per_type: 100000         # Maximum edges per type
  
  # Data splits (temporal splitting)
  train_ratio: 0.7                   # Training data ratio
  val_ratio: 0.15                    # Validation data ratio
  test_ratio: 0.15                   # Test data ratio
  
  # Node feature dimensions (from graph_builder.py)
  node_feature_dims:
    user: 128                        # User node features
    host: 128                        # Host node features
    process: 128                     # Process node features
    file: 128                        # File node features
    registry: 128                    # Registry node features
  
  # Edge types (from graph_builder.py)
  edge_types:
    - ['user', 'logs_into', 'host']
    - ['user', 'executes', 'process']
    - ['process', 'creates', 'process']
    - ['process', 'connects_to', 'host']
    - ['process', 'accesses', 'file']
    - ['process', 'modifies', 'registry']

# Performance Requirements (from SRS.md)
performance:
  # Target metrics
  target_auc_roc: 0.80               # Minimum AUC-ROC
  target_precision_at_10: 0.70       # Minimum Precision@10
  target_recall_at_100: 0.75         # Minimum Recall@100
  
  # Latency requirements
  max_prediction_latency: 5.0        # Maximum prediction time (seconds)
  max_training_time: 28800           # Maximum training time (8 hours)
  
  # Throughput requirements
  min_events_per_minute: 100000      # Minimum event processing rate
  min_snapshots_per_minute: 50       # Minimum graph processing rate

# System Configuration
system:
  # Device settings
  device: 'auto'                     # Options: 'auto', 'cuda', 'cpu'
  gpu_memory_fraction: 0.8           # GPU memory usage limit
  
  # Parallel processing
  num_workers: 4                     # DataLoader workers
  pin_memory: true                   # Pin memory for GPU transfer
  
  # Logging
  log_level: 'INFO'                  # Logging level
  log_interval: 100                  # Log every N batches
  save_interval: 1000                # Save checkpoint every N batches
  
  # Monitoring
  use_tensorboard: true              # Enable TensorBoard logging
  use_wandb: false                   # Enable Weights & Biases (optional)
  
  # Reproducibility
  random_seed: 42                    # Random seed for reproducibility
  deterministic: false               # Deterministic operations (slower)

# Paths Configuration
paths:
  # Model checkpoints
  checkpoint_dir: 'checkpoints'      # Model checkpoint directory
  best_model_path: 'checkpoints/best_model.pth' # Best model path
  
  # Logging
  log_dir: 'outputs/logs'            # Training logs directory
  tensorboard_dir: 'outputs/tensorboard' # TensorBoard logs
  
  # Outputs
  predictions_dir: 'outputs/predictions' # Prediction outputs
  visualizations_dir: 'outputs/visualizations' # Visualization outputs
  reports_dir: 'outputs/reports'     # Generated reports

# Inference Configuration
inference:
  # Prediction settings
  confidence_threshold: 0.7          # Minimum confidence for predictions
  top_k_predictions: 20              # Top-K predictions to return
  
  # Multi-step forecasting
  max_forecast_steps: 5              # Maximum future steps to predict
  confidence_decay: 0.9              # Confidence decay per step
  
  # Batch processing
  inference_batch_size: 32           # Batch size for inference
  
  # Uncertainty quantification
  mc_samples: 10                     # Monte Carlo samples for uncertainty
  
  # Risk scoring
  risk_weights:
    lateral_movement: 1.5            # Weight for lateral movement edges
    privilege_escalation: 1.3        # Weight for privilege escalation
    persistence: 1.2                 # Weight for persistence mechanisms
    defense_evasion: 1.1             # Weight for defense evasion

# Cybersecurity Domain Configuration
cybersecurity:
  # MITRE ATT&CK mapping
  mitre_techniques:
    T1059.001: 'PowerShell'          # Command and Scripting Interpreter
    T1021.002: 'SMB/Windows Admin Shares' # Remote Services
    T1078: 'Valid Accounts'          # Valid Accounts
    T1055: 'Process Injection'       # Process Injection
    T1003: 'OS Credential Dumping'   # Credential Dumping
  
  # High-risk processes (from graph_builder.py)
  high_risk_processes:
    - 'powershell.exe'
    - 'cmd.exe'
    - 'psexec.exe'
    - 'wmic.exe'
    - 'mimikatz.exe'
    - 'rundll32.exe'
    - 'regsvr32.exe'
  
  # Critical registry paths
  critical_registry_paths:
    - 'hklm\\software\\microsoft\\windows\\currentversion\\run'
    - 'hklm\\system\\currentcontrolset\\services'
    - 'hklm\\software\\microsoft\\windows nt\\currentversion\\winlogon'
  
  # Network indicators
  suspicious_ports: [445, 135, 139, 3389, 22, 23, 80, 443]
  
  # File extensions of interest
  executable_extensions: ['.exe', '.bat', '.cmd', '.ps1', '.vbs', '.js']

# Validation Configuration
validation:
  # Cross-validation
  use_cross_validation: false        # Enable k-fold cross-validation
  cv_folds: 5                        # Number of CV folds
  
  # Metrics computation
  compute_detailed_metrics: true     # Compute additional metrics
  save_predictions: true             # Save validation predictions
  
  # Visualization
  plot_training_curves: true         # Plot loss/metric curves
  plot_confusion_matrix: true        # Plot confusion matrix
  plot_roc_curve: true               # Plot ROC curve
  plot_pr_curve: true                # Plot Precision-Recall curve

# Deployment Configuration
deployment:
  # Model serving
  model_format: 'pytorch'            # Model format for serving
  optimize_for_inference: true       # Optimize model for inference
  
  # API settings
  api_timeout: 30                    # API request timeout (seconds)
  max_concurrent_requests: 100       # Maximum concurrent API requests
  
  # Monitoring
  enable_model_monitoring: true      # Enable model performance monitoring
  alert_on_drift: true               # Alert on data/concept drift
  
  # Scaling
  auto_scaling: false                # Enable auto-scaling
  min_replicas: 1                    # Minimum model replicas
  max_replicas: 5                    # Maximum model replicas