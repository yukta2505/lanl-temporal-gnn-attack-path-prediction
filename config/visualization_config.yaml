# THGNN Visualization Configuration
# Production-ready configuration for all visualization components
# Eliminates hardcoded values and provides centralized control

# Global Visualization Settings
global:
  # Default dimensions
  default_width: 1200
  default_height: 800
  
  # Performance settings
  max_nodes_display: 1000
  max_edges_display: 5000
  animation_fps: 30
  
  # Export settings
  export_formats: ['html', 'png', 'svg', 'pdf']
  default_export_format: 'html'
  
  # Caching
  enable_caching: true
  cache_ttl_seconds: 3600
  
  # Security
  max_file_size_mb: 100
  allowed_file_types: ['.json', '.csv', '.jsonl']

# Color Schemes (Centralized - NO MORE DUPLICATES!)
color_schemes:
  # Security-focused entity colors
  security_entities:
    user: '#2E86AB'           # Blue for users
    host: '#A23B72'           # Purple for hosts  
    process: '#F18F01'        # Orange for processes
    file: '#C73E1D'           # Red for files
    registry: '#8B5A3C'       # Brown for registry
    network: '#1ABC9C'        # Teal for network
    unknown: '#95A5A6'        # Gray for unknown
  
  # Risk level colors
  risk_levels:
    low: '#27AE60'            # Green
    medium: '#F39C12'         # Orange
    high: '#E74C3C'           # Red
    critical: '#8E44AD'       # Purple
    unknown: '#95A5A6'        # Gray
  
  # Prediction confidence colors
  prediction_confidence:
    very_high: '#C0392B'      # Dark red (>0.9)
    high: '#E74C3C'           # Red (0.7-0.9)
    medium: '#F39C12'         # Orange (0.5-0.7)
    low: '#F1C40F'            # Yellow (0.3-0.5)
    very_low: '#95A5A6'       # Gray (<0.3)
  
  # MITRE ATT&CK Tactic Colors (SINGLE SOURCE OF TRUTH)
  mitre_tactics:
    TA0001: '#3498DB'         # Initial Access - Blue
    TA0002: '#E67E22'         # Execution - Orange
    TA0003: '#2ECC71'         # Persistence - Green
    TA0004: '#F1C40F'         # Privilege Escalation - Yellow
    TA0005: '#9B59B6'         # Defense Evasion - Purple
    TA0006: '#E74C3C'         # Credential Access - Red
    TA0007: '#1ABC9C'         # Discovery - Teal
    TA0008: '#8E44AD'         # Lateral Movement - Dark Purple
    TA0009: '#F39C12'         # Collection - Orange
    TA0010: '#C0392B'         # Exfiltration - Dark Red
    TA0011: '#34495E'         # Command and Control - Dark Gray
    TA0040: '#D35400'         # Impact - Dark Orange
    default: '#95A5A6'        # Gray for unknown tactics
  
  # UI theme colors
  ui_theme:
    background: '#FFFFFF'
    text: '#2C3E50'
    grid: '#ECF0F1'
    border: '#BDC3C7'
    accent: '#3498DB'
    success: '#27AE60'
    warning: '#F39C12'
    error: '#E74C3C'

# Graph Visualization Configuration
graph_visualization:
  # Layout algorithms
  layout_algorithms:
    default: 'spring'
    options: ['spring', 'circular', 'kamada_kawai', 'shell', 'spectral']
  
  # Node settings
  nodes:
    size_range: [10, 50]
    min_size: 8
    max_size: 60
    opacity: 0.8
    border_width: 2
    border_color: 'white'
    
    # Size calculation
    base_size: 15
    degree_multiplier: 3
    importance_multiplier: 20
  
  # Edge settings
  edges:
    width_range: [1, 8]
    min_width: 1
    max_width: 10
    opacity: 0.6
    
    # Prediction edges
    prediction_width: 4
    prediction_opacity: 0.8
    prediction_dash: 'dash'
  
  # Labels
  labels:
    show_node_labels: true
    show_edge_labels: false
    font_size: 8
    font_color: 'white'
    font_family: 'Arial'
  
  # Animation
  animation:
    frame_duration_ms: 1000
    transition_duration_ms: 300
    auto_play: false

# Timeline Visualization Configuration
timeline_visualization:
  # Event markers
  events:
    marker_size: 12
    marker_opacity: 0.8
    marker_border_width: 2
    marker_border_color: 'white'
  
  # Predictions
  predictions:
    marker_size: 15
    marker_symbol: 'diamond'
    marker_color: 'red'
    show_confidence_bands: true
  
  # Risk timeline
  risk_timeline:
    line_width: 2
    line_color: 'red'
    marker_size: 6
    
    # Risk thresholds
    low_threshold: 0.4
    medium_threshold: 0.6
    high_threshold: 0.8
  
  # Gantt chart (attack chains)
  gantt:
    bar_height: 0.8
    min_duration_seconds: 10
    default_duration_seconds: 60
    
    # Step annotations
    annotation_font_size: 12
    annotation_font_family: 'Arial Black'
    annotation_bg_color: 'rgba(0,0,0,0.5)'

# Process Tree Visualization Configuration
process_tree:
  # Layout
  layout:
    algorithm: 'hierarchical'
    options: ['hierarchical', 'radial', 'tree']
    
    # Hierarchical layout
    level_separation: 2
    node_separation: 1
    
    # Radial layout
    radius_multiplier: 2
    angle_step_factor: 1.0
  
  # Process nodes
  processes:
    base_size: 15
    max_size: 40
    opacity: 0.8
    
    # Size factors
    importance_factor: 20
    children_factor: 3
  
  # Suspicious processes
  suspicious_indicators:
    - 'powershell.exe'
    - 'cmd.exe'
    - 'wmic.exe'
    - 'psexec.exe'
    - 'mimikatz.exe'
    - 'procdump.exe'
    - 'rundll32.exe'
    - 'regsvr32.exe'
    - 'mshta.exe'
    - 'cscript.exe'
    - 'wscript.exe'
  
  # Command line display
  command_lines:
    show: true
    max_length: 100
    truncate_suffix: '...'

# Risk Heatmap Configuration
risk_heatmap:
  # Heatmap settings
  colorscale: 'Reds'
  show_colorbar: true
  
  # Cell settings
  cell_opacity: 0.8
  border_width: 1
  border_color: 'white'
  
  # Text annotations
  show_text: true
  text_color: 'white'
  text_size: 10
  
  # Histogram settings
  histogram:
    bins: 20
    opacity: 0.7
    
  # Threat landscape
  threat_landscape:
    grid_size: 20
    interpolation: 'bilinear'

# Pattern Analysis Configuration
pattern_analysis:
  # Clustering
  clustering:
    min_cluster_size: 3
    max_clusters: 20
    similarity_threshold: 0.7
    
    # K-means settings
    kmeans_init: 10
    kmeans_random_state: 42
    
    # DBSCAN settings
    dbscan_eps: 0.5
    dbscan_min_samples: 3
  
  # Text analysis
  text_analysis:
    max_features: 1000
    ngram_range: [1, 3]
    stop_words: 'english'
  
  # Pattern detection
  patterns:
    min_frequency: 2
    importance_threshold: 0.3
    confidence_threshold: 0.5

# Performance Optimization
performance:
  # Caching
  cache:
    enable: true
    ttl_seconds: 3600
    max_size_mb: 500
  
  # Batch processing
  batch:
    max_batch_size: 1000
    chunk_size: 100
  
  # Memory management
  memory:
    max_memory_mb: 2048
    gc_threshold: 0.8
  
  # GPU acceleration
  gpu:
    enable_if_available: true
    memory_fraction: 0.8

# Security Settings
security:
  # Input validation
  validation:
    max_string_length: 10000
    max_array_length: 100000
    allowed_characters: 'alphanumeric_extended'
  
  # File handling
  files:
    max_size_mb: 100
    scan_for_malware: false
    quarantine_suspicious: false
  
  # Output sanitization
  output:
    escape_html: true
    sanitize_paths: true
    validate_json: true

# Logging Configuration
logging:
  level: 'INFO'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  
  # Performance logging
  performance:
    log_slow_operations: true
    slow_threshold_seconds: 5.0
  
  # Error tracking
  errors:
    log_stack_traces: true
    max_error_length: 5000

# Integration Settings
integration:
  # Streamlit
  streamlit:
    cache_ttl: 3600
    max_widgets: 100
  
  # Export
  export:
    default_dpi: 300
    image_quality: 95
    pdf_page_size: 'A4'
  
  # API
  api:
    timeout_seconds: 30
    max_requests_per_minute: 100